<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ZTM — منظومة الشحن</title>
<script>
const s = localStorage.getItem("ztm_session") || sessionStorage.getItem("ztm_session");
if (s) {
  try {
    const session = JSON.parse(s);
    if (new Date(session.expires_at) > new Date()) {
      window.location.href = "norus-dashboard.html";
    } else { window.location.href = "login.html"; }
  } catch(e) { window.location.href = "login.html"; }
} else {
  window.location.href = "login.html";
}
</script>
</head>
<body></body>
</html>
